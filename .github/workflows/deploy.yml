
name: Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kelkaal/devops-exc
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  TF_IN_AUTOMATION: "true"


concurrency:
  group: devops-pipeline-production
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Run smoke test
        working-directory: ./app
        run: |
          set -e
          node index.js &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          sleep 2
          npm test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to AWS
    needs: build-and-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ./terraform/environments/prod
        run: terraform init -input=false

      
      # - name: Terraform Destroy Plan
      #   working-directory: ./terraform/environments/prod
      #   env:
      #     TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      #   run: |
      #     terraform plan -destroy \
      #       -input=false \
      #       -var="docker_image=ghcr.io/${{ env.IMAGE_NAME }}:latest" \
      #       -var="ssh_public_key=${{ secrets.EC2_SSH_PUBLIC_KEY }}" \
      #       -out=tfplan

      # - name: Terraform Destroy
      #   working-directory: ./terraform/environments/prod
      #   env:
      #     TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      #   run: terraform apply -auto-approve tfplan

      # - name: Verify Terraform State
      #   working-directory: ./terraform/environments/prod
      #   env:
      #     TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      #   run: |
      #     echo "Remaining Terraform resources:"
      #     terraform state list

      - name: Terraform Validate
        working-directory: ./terraform/environments/prod
        run: terraform validate

  
      - name: Terraform Plan
        working-directory: ./terraform/environments/prod
        run: |
          terraform plan \
            -input=false \
            -var="docker_image=ghcr.io/${{ env.IMAGE_NAME }}:latest" \
            -var="ssh_public_key=${{ secrets.EC2_SSH_PUBLIC_KEY }}" \
            -out=tfplan


      - name: Terraform Apply
        working-directory: ./terraform/environments/prod
        run: terraform apply -input=false -auto-approve tfplan
        
      - name: Get EC2 instance ID
        working-directory: ./terraform/environments/prod
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

  
      - name: Deploy Docker image using SSM
        env:
          IMAGE: ghcr.io/kelkaal/devops-exc:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Waiting for EC2 to register with SSM..."

          READY=false
          for i in {1..40}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)

            if [ "$STATUS" = "Online" ]; then
              READY=true
              break
            fi

            echo "Attempt $i/40: SSM not ready yet"
            sleep 15
          done

          if [ "$READY" != "true" ]; then
            echo "EC2 did not register with SSM."
            exit 1
          fi

          jq -n --arg image "$IMAGE" '{
            commands: [
              "set -e",
              "cloud-init status --wait",
              "docker pull " + $image,
              "docker rm -f app || true",
              "docker run -d --name app --restart always -p 3000:3000 -e NODE_ENV=production " + $image
            ]
          }' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM deployment failed or timed out."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json

          echo "Docker deployment command completed successfully."


      - name: Get app URL
        working-directory: ./terraform/environments/prod
        run: |
          APP_URL=$(terraform output -raw app_url)
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app..."
          for i in {1..20}; do
            if curl -sf "${APP_URL}/health"; then
              echo "App is healthy!"
              exit 0
            fi
            echo "Attempt $i/20 - retrying in 15s..."
            sleep 15
          done
          echo "App did not become healthy in time"
          exit 1

      - name: Deployment summary
        run: |
          echo "=================================="
          echo "  Deployed successfully!"
          echo "  URL:    ${{ env.APP_URL }}"
          echo "  Image:  ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "  Commit: ${{ github.sha }}"
          echo "=================================="
