name: Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Run smoke test
        working-directory: ./app
        run: |
          node index.js &
          APP_PID=$!
          sleep 2
          npm test
          kill $APP_PID

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to AWS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ./terraform/environments/prod
        run: terraform init

      
      # - name: Terraform Plan
      #   working-directory: ./terraform/environments/prod
      #   run: |
      #     terraform plan \
      #       -var="docker_image=ghcr.io/${{ github.repository }}:latest" \
      #       -var="ssh_public_key=${{ secrets.EC2_SSH_PUBLIC_KEY }}" \
      #       -out=tfplan

      # - name: Terraform Apply
      #   working-directory: ./terraform/environments/prod
      #   run: terraform apply -auto-approve tfplan

     
      - name: Terraform Destroy
        working-directory: ./terraform/environments/prod
        run: |
          terraform destroy \
            -var="docker_image=ghcr.io/${{ github.repository }}:latest" \
            -var="ssh_public_key=${{ secrets.EC2_SSH_PUBLIC_KEY }}" \
            -auto-approve


      - name: Get app URL
        working-directory: ./terraform/environments/prod
        run: |
          APP_URL=$(terraform output -raw app_url)
          echo "APP_URL=$APP_URL" >> $GITHUB_ENV

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app..."
          for i in {1..20}; do
          if curl -sf "${APP_URL}/health"; then
            echo "App is healthy!"
            exit 0
          fi
          echo "Attempt $i/20 - retrying in 15s..."
          sleep 15
          done
          echo "App did not become healthy in time"
          exit 1

      - name: Deployment summary
        run: |
          echo "=================================="
          echo "  Deployed successfully!"
          echo "  URL:    ${{ env.APP_URL }}"
          echo "  Image:  ghcr.io/${{ github.repository }}:latest"
          echo "  Commit: ${{ github.sha }}"
          echo "=================================="
